<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LifeOS</title>
  <meta name="description" content="Спокійний планувальник дня з котиком Мурчиком">
  <meta name="theme-color" content="#F4EFE8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LifeOS">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Основна навігація">
    <button class="tab" data-tab="today" aria-label="Сьогодні"></button>
    <button class="tab" data-tab="tasks" aria-label="Задачі"></button>
    <button class="tab-add" id="addBtn" aria-label="Додати задачу"></button>
    <button class="tab" data-tab="calendar" aria-label="Календар"></button>
    <button class="tab" data-tab="more" aria-label="Мурчик і налаштування"></button>
  </nav>

  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-grip" aria-hidden="true"></div>
    <h2 id="sheetTitle">Нова справа</h2>
    <form id="taskForm" autocomplete="off">
      <label class="field">
        <span>Що треба зробити</span>
        <input id="fTitle" name="title" required maxlength="120" placeholder="Наприклад: подзвонити у страхову">
      </label>

      <fieldset class="field">
        <legend>Категорія</legend>
        <div class="chips" id="fCats"></div>
      </fieldset>

      <fieldset class="field">
        <legend>Наскільки важливо</legend>
        <div class="seg" id="fPr"></div>
      </fieldset>

      <fieldset class="field">
        <legend>Коли</legend>
        <div class="chips" id="fQuick"></div>
        <div class="row2">
          <label class="mini"><span>Дата</span><input type="date" id="fDate"></label>
          <label class="mini"><span>Час</span><input type="time" id="fTime"></label>
        </div>
      </fieldset>

      <div class="sheet-actions">
        <button type="button" class="btn ghost danger" id="fDelete" hidden>Видалити</button>
        <button type="button" class="btn ghost" id="fCancel">Скасувати</button>
        <button type="submit" class="btn primary">Зберегти</button>
      </div>
    </form>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
