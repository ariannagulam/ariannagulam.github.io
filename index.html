<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Arianna Gulam: Marketing, Content, Design und Websites. Portfolio mit Urban Ranch, SUPERPAW für adidas und Designs. Offen für Kooperationen.">
<meta property="og:title" content="Arianna Gulam · Marketing, Content, Design">
<meta property="og:image" content="img/me.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2750%27 fill=%27%23831111%27/%3E%3Ctext x=%2750%27 y=%2770%27 font-size=%2760%27 text-anchor=%27middle%27 fill=%27%23e9b8b2%27 font-family=%27Georgia%27 font-style=%27italic%27%3EA%3C/text%3E%3C/svg%3E">
<title>Arianna Gulam · Marketing, Content, Design</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@700;800&family=Outfit:wght@400;500;700;800&family=Marck+Script&family=Playfair+Display:ital,wght@0,700;0,800;1,400&display=swap">
<style>
:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: one stage, four "letters" stacked on top of each other; each new one opens with a wax-seal circular wipe. */
:root{
  --burgundi:#831111;--burgundi-deep:#5c0b0d;--cream:#fffaf2;--latte:#f3e6d3;--shoko:#865b4f;--cocoa:#2e2120;--blush:#e9b8b2;--sage:#8a9e8f;
  --line-light:#ecd6cf;--line-dark:#9e3530;--line-cocoa:#4a3734;--muted-light:#9a4a42;--muted-dark:#f2cfc9;--muted-cocoa:#cdb9ad;--cocoa-raised:#3d2c2a;
  --sp-black:#0c0c0c;--sp-white:#f7f4ef;--sp-grey:#d6d1c8;
  --f-display:'Playfair Display','Times New Roman',serif;--f-text:'EB Garamond',Garamond,Georgia,serif;--f-label:Manrope,'Helvetica Neue',Arial,sans-serif;--f-script:'Marck Script','Segoe Script',cursive;
  --r:18px;--pill:999px;
  --sh-sticker:0 7px 6px rgba(30,4,5,.5);--sh-soft:0 12px 32px rgba(30,4,5,.45);--sh-soft-light:0 12px 32px rgba(92,11,13,.14);
  --ease:cubic-bezier(.2,.7,.2,1);
}
html,body{height:100%}
body{background:var(--burgundi);color:var(--cream);font-family:var(--f-text);font-size:18px;line-height:1.5;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid currentColor;outline-offset:3px;border-radius:6px}
.label{font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;line-height:1.2}
.pill{display:inline-block;border:1px solid currentColor;border-radius:var(--pill);padding:8px 16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.02em;line-height:.98}
h1{font-size:clamp(44px,8vw,96px)}
h2{font-size:clamp(34px,5.4vw,64px)}
h1 i,h2 i{font-weight:400;font-style:italic;color:var(--hl)}
.lead{font-size:clamp(18px,2vw,22px);max-width:34em;margin:0}
.script{font-family:var(--f-script);font-size:30px;line-height:1.1}

.stage{position:relative;height:100%;overflow:hidden}
.bar{position:absolute;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px clamp(16px,4vw,48px);color:var(--bar);transition:color .5s}
.bar.top{top:0;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.bar.bottom{bottom:0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.stage[data-tone="dark"]{--bar:var(--cream)}
.stage[data-tone="light"]{--bar:var(--burgundi-deep)}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.langs{display:flex;gap:4px}
.langs button{padding:6px 10px;border-radius:var(--pill);border:1px solid transparent}
.langs button[aria-pressed="true"]{border-color:currentColor}
.nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.nav button{padding:8px 12px;border-radius:var(--pill);border:1px solid transparent;opacity:.75}
.nav button[aria-current="true"]{border-color:currentColor;opacity:1}
.arrows{display:flex;align-items:center;gap:10px}
.arrows button{width:40px;height:40px;border:1px solid currentColor;border-radius:50%;font-size:18px;line-height:1}
.count{font-variant-numeric:tabular-nums}
@media(max-width:640px){.nav{display:none}.brand{font-size:17px}}

.panel{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;visibility:hidden;padding-block:88px 96px;padding-inline:clamp(16px,5vw,72px);display:grid;align-content:center;background:var(--bg);color:var(--fg)}
.panel.active{visibility:visible;z-index:1}
.panel.enter{visibility:visible;z-index:2;animation:wipe .9s var(--ease) both}
@keyframes wipe{from{clip-path:circle(0 at var(--x,50%) var(--y,50%))}to{clip-path:circle(150vmax at var(--x,50%) var(--y,50%))}}
.inner{width:100%;max-width:1180px;margin-inline:auto;display:grid;gap:32px}
.panel.active .rise,.panel.enter .rise{animation:rise .6s var(--ease) both;animation-delay:calc(var(--d,0) * 90ms + 150ms)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 1 — cover */
#p-hello{--bg:var(--burgundi);--fg:var(--cream);--hl:var(--blush)}
.cover{grid-template-columns:1.1fr .9fr;align-items:center}
.cover>div{min-width:0;display:grid;gap:24px;justify-items:start}
.btn{display:inline-block;background:var(--cream);color:var(--burgundi-deep);border-radius:var(--r);padding:14px 22px;transition:transform .3s var(--ease)}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:none;color:inherit;border:1px solid currentColor}
.row{display:flex;gap:12px;flex-wrap:wrap}
.envwrap{justify-items:center!important;perspective:1200px;padding-top:40px}
.env{position:relative;width:min(400px,100%);aspect-ratio:3/2;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) rotate(-4deg);transition:transform .25s ease-out}
.env-back,.env-front,.flap{position:absolute;inset:0;border-radius:10px}
.env-back{background:var(--shoko);box-shadow:var(--sh-soft)}
.env-front{background:var(--latte);clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%);z-index:3}
.env-front::after{content:"";position:absolute;inset:0;background:var(--line-light);clip-path:polygon(0 100%,50% 50%,100% 100%,100% 99%,50% 49%,0 99%)}
.flap{background:var(--blush);clip-path:polygon(0 0,100% 0,50% 56%);transform-origin:top;transition:transform .6s var(--ease);z-index:4}
.card{position:absolute;left:6%;right:6%;top:6%;bottom:6%;background:var(--cream);color:var(--burgundi-deep);border-radius:10px;padding:18px;display:grid;align-content:center;gap:6px;text-align:center;z-index:2;transition:transform .7s var(--ease);box-shadow:var(--sh-sticker)}
.card h3{font-size:clamp(22px,3vw,30px);color:var(--burgundi)}
.card p{margin:0;font-size:15px}
.card .label{color:var(--muted-light);font-size:10px}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .card{transform:translateY(-78%)}
.env.front .card{z-index:6;transform:translateY(-12%) rotate(5deg) scale(1.06)}
.seal{position:absolute;left:50%;top:52%;width:84px;height:84px;margin:-42px 0 0 -42px;z-index:7;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a52222,var(--burgundi-deep) 75%);background-color:var(--burgundi);color:var(--blush);box-shadow:var(--sh-sticker);display:grid;place-items:center;font-family:var(--f-display);font-style:italic;font-size:34px;transition:transform .5s var(--ease),opacity .4s;animation:pulse 2.4s ease-in-out infinite}
.seal::before{content:"";position:absolute;inset:8px;border:1px solid var(--blush);border-radius:50%;opacity:.6}
@keyframes pulse{50%{transform:scale(1.07) rotate(-6deg)}}
.env.open .seal{transform:translateY(60px) rotate(40deg) scale(.5);opacity:0;pointer-events:none;animation:none}
.hint{display:flex;align-items:center;gap:8px;color:var(--blush);margin-top:8px}
.hint svg{width:64px;height:40px;transform:rotate(-100deg)}
.draw{stroke-dasharray:200;stroke-dashoffset:200;animation:draw 1.2s .8s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

.cover .envwrap{padding-top:16px}
.portrait{margin:0;justify-self:end;width:min(290px,64%);position:relative;transform:rotate(3deg);transition:transform .6s var(--ease)}
.portrait:hover{transform:rotate(1deg) translateY(-4px)}
.portrait img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:50% 18%;border-radius:240px 240px var(--r) var(--r);border:8px solid var(--latte);outline:1px solid var(--shoko);outline-offset:-4px;box-shadow:var(--sh-soft)}
.portrait figcaption{position:absolute;top:16%;right:-14px;background:var(--sage);color:var(--burgundi-deep);border-radius:var(--pill);padding:7px 12px;transform:rotate(10deg);box-shadow:var(--sh-sticker)}
.cover .env{justify-self:start;margin-top:-120px;width:min(360px,88%)}
.cover .hint{justify-self:start}
/* 2 — experience */
#p-weg{--bg:var(--cream);--fg:var(--burgundi-deep);--hl:var(--burgundi)}
.tags{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:24px;position:relative}
.tag{background:var(--latte);border-radius:var(--r);padding:24px;box-shadow:var(--sh-soft-light);display:grid;gap:10px;align-content:start;transform:rotate(var(--rot,0deg));transition:transform .4s var(--ease)}
.tag:hover{transform:rotate(calc(var(--rot,0deg) + 2deg)) translateY(-4px)}
.tag .when{color:var(--burgundi)}
.tag h3{font-size:26px;letter-spacing:-.01em;line-height:1.05}
.tag p,.tag ul{margin:0;font-size:17px}
.tag ul{padding-left:18px}
.tag li::marker{color:var(--sage)}
.stamp{justify-self:end;width:52px;height:60px;border:2px dashed var(--shoko);border-radius:6px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--burgundi);font-size:22px;transform:rotate(8deg);margin-bottom:-36px}
.skills{display:flex;gap:8px;flex-wrap:wrap;color:var(--burgundi)}

/* 3 — work */
#p-arbeiten{--bg:var(--cocoa);--fg:var(--cream);--hl:var(--blush)}
.frames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;align-items:end}
.frame{display:grid;gap:14px;text-align:left;transition:transform .45s var(--ease)}
.frame:hover{transform:translateY(-8px) rotate(-1.5deg)}
.frame:nth-child(2):hover{transform:translateY(-8px) rotate(1.5deg)}
.pic{border:10px solid var(--latte);outline:1px solid var(--shoko);outline-offset:-5px;border-radius:var(--r);aspect-ratio:4/5;max-width:100%;overflow:hidden;box-shadow:var(--sh-soft);position:relative;display:grid;place-items:center;padding:18px;text-align:center}
.frame:nth-child(2) .pic{border-radius:240px 240px var(--r) var(--r)}
.pic.ur{background:var(--burgundi);color:var(--cream)}
.pic.adi{padding:0;background:var(--sp-black);font-family:Outfit,Arial,sans-serif}
.pic.adi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:100% 50%}
.sp-word{display:none;position:absolute;left:16px;top:44px;font-weight:800;font-size:clamp(30px,3.4vw,46px);line-height:.85;letter-spacing:-.03em;color:var(--sp-black);text-align:left}
.sp-word b{display:block;color:var(--sp-white)}
.pic.ig{background:var(--blush);color:var(--burgundi-deep)}
.pic .big{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,3vw,40px);line-height:.95}
.open-tag{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:var(--cream);color:var(--burgundi-deep);border-radius:var(--pill);padding:7px 12px;font-size:10px;white-space:nowrap}
.frame h3{font-size:24px;line-height:1.05;letter-spacing:-.01em}
.frame p{margin:0;color:var(--muted-cocoa);font-size:16px}
.minifan{display:flex;justify-content:center}
.minifan span{width:44px;height:64px;border-radius:8px;background:var(--cream);border:1px solid var(--shoko);margin-inline:-10px;transform:rotate(calc((var(--i) - 2) * 9deg)) translateY(calc((var(--i) - 2) * (var(--i) - 2) * 4px));transition:transform .4s var(--ease)}
.frame:hover .minifan span{transform:rotate(calc((var(--i) - 2) * 14deg)) translateY(calc((var(--i) - 2) * (var(--i) - 2) * 6px - 6px))}

/* 4 — contact */
#p-kontakt{--bg:var(--burgundi-deep);--fg:var(--cream);--hl:var(--blush)}
.contact{grid-template-columns:1.2fr .8fr;align-items:center}
.contact>div{min-width:0;display:grid;gap:22px;justify-items:start}
.mail{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.mail span{font-family:var(--f-display);font-size:clamp(20px,3vw,34px);user-select:all;overflow-wrap:anywhere}
.ring{width:min(300px,70vw);aspect-ratio:1;position:relative;justify-self:center!important}
.ring svg{width:100%;height:100%;animation:spin 26s linear infinite}
.ring text{font-family:var(--f-label);font-weight:700;font-size:11px;letter-spacing:.2em;fill:var(--blush);text-transform:uppercase}
.ring .core{position:absolute;inset:19%;border-radius:50%;padding:7px;background:var(--latte);box-shadow:0 0 0 1px var(--shoko),0 0 0 5px var(--burgundi),0 0 0 6px var(--blush),var(--sh-soft);transition:transform .6s var(--ease)}
.ring .core::after{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--shoko),inset 0 6px 18px rgba(30,4,5,.45);pointer-events:none}
.ring .core img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 16%}
.ring:hover .core{transform:scale(1.04) rotate(-2deg)}
@keyframes spin{to{transform:rotate(360deg)}}
.services{display:flex;gap:8px;flex-wrap:wrap;color:var(--blush)}

/* designs table */
#p-designs{--bg:var(--latte);--fg:var(--burgundi-deep);--hl:var(--burgundi)}
.table{position:relative;height:400px}
.print{position:absolute;left:var(--l);top:var(--t);width:var(--w);transform:rotate(var(--r));transition:left .7s var(--ease),top .7s var(--ease),transform .5s var(--ease);background:var(--cream);padding:8px 8px 6px;border-radius:8px;box-shadow:var(--sh-soft-light);display:grid;gap:6px;text-align:left}
.print img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:4px;display:block}
.print span{font-size:9px;color:var(--muted-light)}
.print:hover,.print:focus-visible{transform:rotate(0deg) scale(1.08) translateY(-8px);z-index:5}
.btn.dark{background:var(--burgundi);color:var(--cream)}
.tag.wide ul{columns:2;column-gap:28px}
.tag li{break-inside:avoid;margin-bottom:4px}
.muted{color:var(--muted-light)}
.urframe{width:100%;height:min(74vh,760px);border:0;display:block;background:var(--cocoa)}
.sheet.wide{width:min(1180px,100%)}
.sp-page{width:100%;display:block;animation:slidein .5s var(--ease) both}
.lightbox{display:block;max-width:100%;max-height:80vh;margin:auto}
.fallback{padding:32px;display:grid;gap:16px;justify-items:start}
@media(max-width:820px){.tag.wide ul{columns:1}}
@media(max-width:700px){.table{height:460px}}

/* viewer */
.viewer{position:absolute;inset:0;z-index:40;background:rgba(46,33,32,.82);display:grid;place-items:center;padding:16px}
.sheet{width:min(920px,100%);max-height:100%;background:var(--cream);color:var(--burgundi-deep);border-radius:var(--r);box-shadow:var(--sh-soft);display:grid;grid-template-rows:auto 1fr;overflow:hidden;animation:pop .5s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96) rotate(-1deg)}}
.chrome{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--latte);border-bottom:1px solid var(--line-light)}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--shoko)}.dots i:first-child{background:var(--burgundi)}.dots i:last-child{background:var(--sage)}
.url{flex:1;min-width:0;background:var(--cream);border-radius:var(--pill);padding:6px 14px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted-light)}
.close{width:34px;height:34px;border:1px solid currentColor;border-radius:50%}
.vbody{overflow:auto;min-height:0}
.note{font-size:13px;font-style:italic;padding:8px 16px;margin:0;color:var(--muted-light);background:var(--cream)}

/* Urban Ranch demo site */
.ur-site{background:var(--cocoa);color:var(--cream);min-height:440px;display:grid;grid-template-rows:auto 1fr}
.ur-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line-cocoa)}
.ur-logo{font-family:var(--f-label);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.ur-tabs{display:flex;gap:4px;flex-wrap:wrap}
.ur-tabs button{padding:7px 12px;border-radius:var(--pill)}
.ur-tabs button[aria-selected="true"]{background:var(--blush);color:var(--burgundi-deep)}
.ur-page{padding:28px 20px;display:grid;gap:20px;align-content:start;animation:rise .45s var(--ease) both}
.ur-page h3{font-family:var(--f-label);font-weight:800;text-transform:uppercase;font-size:clamp(28px,5vw,52px);letter-spacing:-.02em;line-height:.95}
.ur-page h3 em{font-style:normal;color:var(--blush)}
.ur-page p{margin:0;color:var(--muted-cocoa);max-width:36em}
.ur-btn{background:var(--blush);color:var(--burgundi-deep);border-radius:var(--pill);padding:12px 18px}
.ur-btn.o{background:none;color:var(--cream);border:1px solid var(--cream)}
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.flip{perspective:800px;aspect-ratio:3/4;max-width:100%}
.flip>div{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s var(--ease)}
.flip[aria-pressed="true"]>div{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);background:var(--cocoa-raised);border:1px solid var(--line-cocoa);display:grid;place-items:center;align-content:center;gap:12px;padding:14px;text-align:center}
.face.b{transform:rotateY(180deg);background:var(--blush);color:var(--burgundi-deep);font-size:16px}
.burger{display:grid;gap:3px;width:74px}
.burger i{display:block;border-radius:6px;height:8px}
.burger .bun{background:var(--latte);height:20px;border-radius:40px 40px 6px 6px}
.burger .bun.lo{height:12px;border-radius:6px 6px 14px 14px}
.burger .pat{background:var(--shoko);height:11px}
.burger .ch{background:var(--blush);height:5px}
.burger .sal{background:var(--sage);height:5px}
.locs{display:grid;gap:10px}
.loc{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--cocoa-raised);border:1px solid var(--line-cocoa);border-radius:var(--r);padding:16px 18px}
.loc b{font-family:var(--f-label);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.status{display:flex;align-items:center;gap:8px}
.status i{width:10px;height:10px;border-radius:50%;background:var(--sage);animation:blink 1.6s infinite}
.status.off i{background:var(--shoko);animation:none}
@keyframes blink{50%{opacity:.35}}
.game{display:grid;justify-items:center;gap:16px;text-align:center}
.patty{width:150px;height:150px;border-radius:50%;background:var(--shoko);box-shadow:inset 0 -14px 0 rgba(0,0,0,.2),var(--sh-sticker);transition:height .08s,border-radius .08s,margin .08s;color:var(--cream)}
.patty:active{height:70px;margin-top:80px;border-radius:50%/60%}
.score{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:.9;color:var(--blush);font-variant-numeric:tabular-nums}

/* SUPERPAW case — in its own brand register */
.sp{font-family:Outfit,Arial,sans-serif;background:var(--sp-black);color:var(--sp-white)}
.sp-slide{display:grid;grid-template-columns:1fr 1fr;background:var(--sbg);color:var(--sfg);animation:slidein .5s var(--ease) both}
@keyframes slidein{from{opacity:0;transform:translateX(calc(var(--dir,1) * 40px))}}
.sp-slide img{width:100%;height:min(560px,66vh);object-fit:cover;display:block}
.sp-slide img.contain{object-fit:contain;padding:20px}
.sp-slide.rev img{order:2}
.sp-txt{padding:clamp(20px,4vw,48px);display:grid;gap:16px;align-content:center;min-width:0}
.sp-txt h3{font-family:inherit;font-weight:800;font-size:clamp(34px,5vw,64px);line-height:.95;letter-spacing:-.03em}
.sp-txt h3.xl{font-size:clamp(64px,11vw,136px);line-height:.85}
.sp-txt p{margin:0;font-size:17px;line-height:1.4}
.sp-txt p.b{font-weight:700;font-size:clamp(20px,2.4vw,26px);line-height:1.2}

  vbody.innerHTML=`<iframe class="urframe" id="urf" src="ur/index.html" title="Urban Ranch Website"></iframe><p class="note">Die echte Website, direkt klickbar. <a href="${LIVE}" target="_blank" rel="noopener">Live-Website öffnen ↗</a></p>`;
  setTimeout(()=>{const f=$('#urf');if(!f)return;let ok=false;try{ok=f.contentDocument&&f.contentDocument.body&&f.contentDocument.body.children.length>0}catch(e){}
    if(!ok)f.outerHTML=`<div class="fallback"><h3>Urban Ranch Website</h3><p>Die Vorschau lässt sich hier nicht einbetten. Öffne die Website in einem neuen Tab:</p><div class="row"><a class="btn dark label" href="ur/index.html" target="_blank">Start</a><a class="btn dark label" href="ur/menue.html" target="_blank">Menü</a><a class="btn dark label" href="ur/standorte.html" target="_blank">Standorte</a></div></div>`},3000)}

/* SUPERPAW — the six pages of the deck */
const SP=['superpaw. three stripes. four legs. Product concept, winter 2026, by Arianna Gulam','winter hits paws first. we lace up. they go barefoot.','built for paws: soft upper, rubber wrap, cuff and strap','a sole shaped like a paw: anatomical pods, cushion where it lands, grip on ice','four ways to wear winter: burgundy, beige, black, olive','no bad weather. just bare paws. Self-initiated concept for adidas by Arianna Gulam'];
function openAdi(){$('#vurl').textContent='superpaw · adidas concept · winter 2026';let i=0;$('.sheet').classList.add('wide');
  vbody.onclick=null;vbody.innerHTML=`<div class="sp"><div id="ads"></div><div class="sp-ctrl"><button id="ap">← back</button><span id="ac"></span><button id="an">next →</button></div></div>`;
  const show=d=>{i=(i+d+SP.length)%SP.length;$('#ads').innerHTML=`<img class="sp-page" style="--dir:${d<0?-1:1}" src="img/sp${i+1}.jpg" alt="${SP[i]}">`;$('#ac').textContent=(i+1)+' / '+SP.length};
  $('#ap').onclick=()=>show(-1);$('#an').onclick=()=>show(1);$('#ads').onclick=()=>show(1);show(0)}

/* designs table */
const DES=['Story · Bestsellers','Feed · Burger Close-ups','Feed · Lil Cheese Menu','Print · Speisekarte','Feed · Bella Fries','Feed · Royal Fries'];
const table=$('#table');let slots=DES.map((_,i)=>i);
table.innerHTML=DES.map((d,i)=>`<button class="print" data-d="${i}"><img src="img/d${i+1}.jpg" alt="${d}" loading="lazy"><span class="label">${d}</span></button>`).join('');
function lay(){const m=innerWidth<700,cols=m?3:6,w=m?31:18;$$('.print',table).forEach((p,k)=>{const s=slots[k],c=s%cols,r=Math.floor(s/cols);p.style.setProperty('--w',w+'%');p.style.setProperty('--l',c*((100-w)/(cols-1))+'%');p.style.setProperty('--t',(m?r*50:0)+Math.random()*10+'%');p.style.setProperty('--r',(Math.random()*14-7)+'deg')})}
lay();addEventListener('resize',lay);
$('#shuffle').onclick=()=>{slots.sort(()=>Math.random()-.5);lay()};
table.onclick=e=>{const b=e.target.closest('.print');if(!b)return;lastFocus=b;const i=+b.dataset.d;viewer.hidden=false;$('.sheet').classList.remove('wide');vbody.onclick=null;$('#vurl').textContent=DES[i];vbody.innerHTML=`<img class="lightbox" src="img/d${i+1}.jpg" alt="${DES[i]}">`;$('#vclose').focus()};

/* strategy */
const PIL=[['Craft Proof','Show how it is made: the grill, the smash, the hands.'],['Trend Remix','Current formats, retold in the brand\'s voice.'],['Unscripted Proof','Real moments from the kitchen and the counter.'],['Community Voice','Guests and their stories take the stage.'],['Local Turf','Frankfurt and Darmstadt as part of the brand.']];
function openIG(){$('#vurl').textContent='urban ranch · instagram content strategy';vbody.onclick=null;
  vbody.innerHTML=`<div class="strat"><h3>five pillars, <i>no overlap</i></h3><div class="pillars">${PIL.map((p,i)=>`<button class="pillar" style="--i:${i}" aria-expanded="false"><span class="num">0${i+1}</span><b>${p[0]}</b><span class="t">${p[1]}</span></button>`).join('')}</div><p class="note" style="padding:0">Tap a card to open it.</p></div>`;
  $$('.pillar',vbody).forEach(b=>b.onclick=()=>b.setAttribute('aria-expanded',b.getAttribute('aria-expanded')!=='true'))}
</script>
